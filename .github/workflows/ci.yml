name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sisi
          POSTGRES_PASSWORD: sisi_dev_pw
          POSTGRES_DB: sisi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sisi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint (ruff)
        run: cd backend && ruff check app tests scripts
      - name: Type check (mypy)
        run: cd backend && mypy app
      - name: Tests with coverage
        env:
          SISI_TEST_DATABASE_URL: postgresql+psycopg://sisi:sisi_dev_pw@localhost:5432/sisi_test
          SISI_MASTER_KEY_B64: dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
        run: cd backend && pytest --cov=app --cov=app.rules --cov-report=term-missing --cov-fail-under=70
      - name: Dependency security scan
        run: pip install pip-audit && pip-audit
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unit tests (golden parity, safety invariants, property tests, privacy lint)
        working-directory: mobile
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Assemble release APK
        working-directory: mobile
        run: ./gradlew assembleRelease --console=plain
      - name: APK size budget (25 MB)
        run: |
          size=$(stat -c%s mobile/app/build/outputs/apk/release/app-release.apk)
          mb=$((size / 1048576))
          echo "APK size: $mb MB (budget 25 MB)"
          test "$size" -le 26214400
