[project]
name = "sisi-backend"
version = "0.1.0"
description = "SISI Health backend — core, deterministic rules engine, audit trail, consent (Phase 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.10,<3",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=44,<46",
    "jsonschema>=4.23,<5",
    "tzdata>=2024.2",
    "arq>=0.26",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert in tests

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["app.rules", "app.consent"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
