# SISI Health staff console — static SPA server.
# Caddy (deploy/Caddyfile) terminates TLS and owns all API routing; nginx only has to
# hand back the built bundle for any path, because the app uses client-side routing
# (react-router) and the browser reloads deep links such as /corridor/consults/<id>.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No directory listings, no version banner (the console is staff-only).
    autoindex off;
    server_tokens off;

    # Hashed Vite assets are immutable; the HTML shell must never be cached or staff
    # would keep loading a stale console after a deploy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # SPA history fallback: unknown paths render the app shell, not nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
